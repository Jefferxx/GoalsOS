version: '3.8'

services:
  # --- BASE DE DATOS (PostgreSQL) ---
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"

  # --- COLA DE TAREAS (Redis) ---
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  # --- BACKEND (FastAPI) ---
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # ✅ REFERENCIA SEGURA: Lee del archivo .env local
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY} # 🔐 Clave de firma JWT
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}

  # 🤖 EL CEREBRO ASÍNCRONO (Celery Worker)
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A src.celery_app.celery_app worker --loglevel=info
    volumes:
      - ./apps/api:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      # ✅ CORREGIDO: El worker ahora también usa referencias seguras
      - GOOGLE_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY} # 🔐 Clave de firma JWT

  # ⏰ EL CRONÓMETRO (Celery Beat)
  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: celery -A src.celery_app.celery_app beat --loglevel=info
    volumes:
      - ./apps/api:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0

  # --- FRONTEND (Next.js) ---
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Solo servidor: dentro de la red de Docker, "localhost" del contenedor web
      # no llega al contenedor api. NextAuth (server-side) usa este host interno.
      - API_INTERNAL_URL=http://api:8000
      - NEXTAUTH_URL=http://localhost:3000
      # ✅ REFERENCIA SEGURA: Lee del archivo .env local (antes hardcodeado)
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}

volumes:
  postgres_data:
