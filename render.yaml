databases:
  - name: goalos-db
    plan: free
    databaseName: goalos_v4
    user: goalos_admin

services:
  - type: redis
    name: goalos-redis
    plan: free
    ipAllowList: []

  - type: web
    name: goalos-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: uvicorn src.main:app --host 0.0.0.0 --port 8000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goalos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: goalos-redis
          type: redis
          property: connectionString
      - fromGroup: goalos-secrets

  - type: worker
    name: goalos-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: celery -A src.celery_app.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goalos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: goalos-redis
          type: redis
          property: connectionString
      - fromGroup: goalos-secrets

  - type: worker
    name: goalos-beat
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: celery -A src.celery_app.celery_app beat --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goalos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: goalos-redis
          type: redis
          property: connectionString
      - fromGroup: goalos-secrets

envVarGroups:
  - name: goalos-secrets
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "8"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false
